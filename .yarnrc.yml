approvedGitRepositories:
  - "**"

# Dependency install scripts never run. The four packages that ship one
# (esbuild, @parcel/watcher, lmdb, msgpackr-extract) load their prebuilt
# platform binaries without it.
enableScripts: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.1.cjs
