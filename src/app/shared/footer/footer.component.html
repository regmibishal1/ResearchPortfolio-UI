<footer class="footer">
  <div class="footer-content container">
    <div class="footer-brand">
      <img src="./assets/logo-96.webp" width="36" height="36" alt="" class="footer-logo" />
      <span class="footer-name">Bishal Regmi</span>
    </div>
    <ul class="footer-links">
      @for (link of socialLinks; track link.name) {
        <li>
          <a
            [href]="link.url"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener noreferrer' : null"
            class="footer-social-link"
          >
            <app-icon [name]="link.icon" />
            <span>{{ link.name }}</span>
          </a>
        </li>
      }
    </ul>
    <div class="footer-meta">
      <p>&copy; {{ currentYear }} Bishal Regmi</p>
      @if (buildDate) {
        <p>Last updated {{ buildDate | date: 'MMM d, y' }}</p>
      }
    </div>
  </div>
</footer>
