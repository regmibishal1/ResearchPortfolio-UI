<footer class="footer">
  <div class="footer-content">
    <div class="footer-brand">
      <img src="./assets/logo-96.webp" width="36" height="36" alt="Logo" class="footer-logo" />
      <span class="footer-name">Bishal Regmi</span>
    </div>
    <div class="footer-links">
      @for (link of socialLinks; track link) {
        <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="footer-social-link">
          <mat-icon>{{ link.icon }}</mat-icon>
          <span>{{ link.name }}</span>
        </a>
      }
    </div>
    <div class="footer-copy">&copy; {{ currentYear }} Bishal Regmi. All rights reserved.</div>
  </div>
</footer>
