<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<mat-toolbar class="toolbar-container" role="banner">
  <button
    #menuButton
    mat-icon-button
    type="button"
    class="nav-menu-btn"
    aria-controls="mobile-nav"
    [attr.aria-expanded]="menuOpen"
    [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    <app-icon [name]="menuOpen ? 'close' : 'menu'" />
  </button>
  <a class="brand-link" [routerLink]="['']" aria-label="Bishal Regmi, home">
    <img class="logo-img" src="./assets/logo-96.webp" width="32" height="32" alt="" />
    <span class="title-text">Bishal Regmi</span>
  </a>
  <span class="spacer"></span>

  <nav class="desktop-nav" aria-label="Primary">
    @for (link of navLinks; track link.path) {
      <a
        class="nav-link"
        [routerLink]="link.path"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
        >{{ link.label }}</a
      >
    }
    <a class="nav-contact" [routerLink]="['/about']" fragment="contact">Contact</a>
  </nav>

  <app-site-search />

  @if (isAuthenticated) {
    <span class="user-profile">
      <a class="btn-secondary btn-md" [routerLink]="['/profile']">Profile</a>
      <button type="button" class="btn-secondary btn-md" (click)="onLogout()">Sign out</button>
    </span>
  }
</mat-toolbar>

<nav id="mobile-nav" class="mobile-nav" aria-label="Primary" [hidden]="!menuOpen">
  @for (link of navLinks; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="mobile-active" ariaCurrentWhenActive="page">{{
      link.label
    }}</a>
  }
  <a [routerLink]="['/about']" fragment="contact">Contact</a>
  @if (isAuthenticated) {
    <a [routerLink]="['/profile']" routerLinkActive="mobile-active" ariaCurrentWhenActive="page"
      >Profile</a
    >
    <button type="button" (click)="onLogout()">Sign out</button>
  }
</nav>

<div class="page-shell">
  <main #main id="main" class="page-content" tabindex="-1">
    <ng-content></ng-content>
  </main>
  <app-footer></app-footer>
</div>
