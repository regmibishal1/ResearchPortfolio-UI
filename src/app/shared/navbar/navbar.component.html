<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<mat-toolbar class="toolbar-container glass">
  <button
    #menuButton
    mat-icon-button
    type="button"
    class="nav-menu-btn"
    aria-controls="mobile-nav"
    [attr.aria-expanded]="menuOpen"
    [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    <mat-icon aria-hidden="true">{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
  <a class="brand-link" [routerLink]="['']" aria-label="Bishal Regmi, home">
    <img class="logo-img" src="./assets/logo-96.webp" width="40" height="40" alt="" />
    <span class="title-text">Bishal Regmi</span>
  </a>
  <span class="spacer"></span>

  <nav class="desktop-nav" aria-label="Primary">
    <a
      mat-button
      [routerLink]="['']"
      routerLinkActive="nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Home</a
    >
    <a
      mat-button
      [routerLink]="['/project']"
      routerLinkActive="nav-active"
      ariaCurrentWhenActive="page"
      >Projects</a
    >
    <a
      mat-button
      [routerLink]="['/blog']"
      routerLinkActive="nav-active"
      ariaCurrentWhenActive="page"
      >Blog</a
    >
    <a
      mat-button
      [routerLink]="['/about']"
      routerLinkActive="nav-active"
      ariaCurrentWhenActive="page"
      >About</a
    >
  </nav>

  <span class="user-profile" *ngIf="isAuthenticated">
    <button mat-stroked-button class="login-btn" [routerLink]="['/profile']">Profile</button>
    <button mat-stroked-button class="login-btn" (click)="onLogout()">Logout</button>
  </span>
</mat-toolbar>

<nav id="mobile-nav" class="mobile-nav" aria-label="Primary" [hidden]="!menuOpen">
  <a
    [routerLink]="['']"
    routerLinkActive="mobile-active"
    [routerLinkActiveOptions]="{ exact: true }"
    ariaCurrentWhenActive="page"
    >Home</a
  >
  <a [routerLink]="['/project']" routerLinkActive="mobile-active" ariaCurrentWhenActive="page"
    >Projects</a
  >
  <a [routerLink]="['/blog']" routerLinkActive="mobile-active" ariaCurrentWhenActive="page">Blog</a>
  <a [routerLink]="['/about']" routerLinkActive="mobile-active" ariaCurrentWhenActive="page"
    >About</a
  >
</nav>

<div class="page-shell">
  <main #main id="main" class="page-content" tabindex="-1">
    <ng-content></ng-content>
  </main>
  <app-footer></app-footer>
</div>
