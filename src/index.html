    <!-- Self-hosted fonts (fontsource), declared here rather than in the
         stylesheet so they apply from the first paint. Until a file arrives
         the text uses an Arial-class face scaled to the same metrics
         (values from @capsizecss/metrics), so the swap barely moves anything. -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 400 700;
        src: url('/assets/fonts/inter-latin-wght-400-700.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/assets/fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Outfit Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/assets/fonts/outfit-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Outfit Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/assets/fonts/outfit-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial'), local('Helvetica'), local('Liberation Sans'), local('Arimo');
        size-adjust: 107.12%;
        ascent-override: 90.44%;
        descent-override: 22.52%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial'), local('Helvetica'), local('Liberation Sans'), local('Arimo');
        size-adjust: 99.82%;
        ascent-override: 100.18%;
        descent-override: 26.05%;
        line-gap-override: 0%;
      }
    </style>
